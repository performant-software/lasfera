{% if toponym.authority_file %}
    <dl class="flex gap-1 items-center">
        <dt class="flex items-center font-bold after:content-[':'] after:font-normal whitespace-nowrap shrink-0">
            World Historical Gazetteer
        </dt>
        <dd>
            <a class="underline hover:no-underline break-all" href="{{ toponym.authority_file }}">
                {{ toponym.authority_file }}
            </a>
        </dd>
        <div class="relative flex" x-data="{ open: false }">
            <button 
                type="button"
                @click="open = !open"
                @click.away="open = false"
                class="flex items-center justify-center text-gray-500 hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-full p-0.5 leading-none"
                aria-label="What is the World Historical Gazetteer?"
                aria-expanded="false">
                <i class="fa-solid fa-circle-question" aria-hidden="true"></i>
            </button>

            <div 
                x-show="open" 
                style="display: none;" 
                class="absolute bottom-full mb-2 left-1/2 -translate-x-1/2 font-normal w-72 p-3 bg-gray-700 text-white text-sm rounded shadow-lg z-50 whitespace-normal break-words leading-relaxed text-center">
                <p class="whitespace-normal">
                    The World Historical Gazetteer (WHG) is a platform for linked open historical place data.
                    Click the link to view spatial data, variant names, and historical context for this location.
                </p>
                <div class="absolute top-full left-1/2 -translate-x-1/2 border-8 border-transparent border-t-gray-700"></div>
            </div>
        </div>
    </dl>
{% endif %}
