{% load wagtailimages_tags %}

<figure class="my-6">
    {% image value.image max-650x650 as img %}
    <img src="{{ img.url }}" alt="{{ img.alt }}" class="w-auto h-auto mx-auto rounded-lg shadow-md border border-gray-300">
    {% if value.caption %}
        <figcaption class="mt-3 text-center text-sm italic text-gray-500">
            {{ value.caption }}
        </figcaption>
    {% endif %}
</figure>
