{% load wagtailcore_tags wagtailimages_tags %}
{# The image floats beside the text on wider screens; the block contains the float, so whatever comes next starts below both. #}
<div class="image-text image-text-{{ value.image_side }} image-text-{{ value.image_width }}">
    {% if value.image %}
    {% image value.image width-800 as img %}
    <figure>
        <img src="{{ img.url }}"
             alt="{% if value.alt_text %}{{ value.alt_text }}{% else %}{{ img.alt }}{% endif %}"
             width="{{ img.width }}" height="{{ img.height }}"
             class="rounded-lg shadow-md border border-gray-300">
        {% if value.caption %}
            <figcaption class="mt-3 text-center text-sm italic text-gray-500">{{ value.caption }}</figcaption>
        {% endif %}
    </figure>
    {% endif %}
    {% include_block value.text %}
</div>
